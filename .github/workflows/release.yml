name: Build and Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Build
              run: |
                  npm install
                  npm run build

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    main.js \
                    manifest.json \
                    styles.css \
                    --clobber
