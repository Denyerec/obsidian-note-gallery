name: Build and Test

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        name: Lint

        steps:
            - name: Checkout latest main
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

    format:
        runs-on: ubuntu-latest
        name: Format

        steps:
            - name: Checkout latest main
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Install dependencies
              run: npm install

            - name: Check format
              run: npm run check-format

    build:
        runs-on: ubuntu-latest
        name: Build

        steps:
            - name: Checkout latest main
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Install dependencies
              run: npm install

            - name: Build
              run: npm run build
